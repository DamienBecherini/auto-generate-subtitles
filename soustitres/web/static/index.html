<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subtitles</title>
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23264653'/%3E%3Crect x='6' y='19' width='20' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='9' y='24' width='14' height='3' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body class="chargement">
<header>
  <h1 data-i18n="ui.title"></h1>
  <div class="moteurs">
    <span class="puce" id="puce-transcription" data-i18n-title="ui.header.transcription_title">…</span>
    <span class="puce" id="puce-traducteur" data-i18n-title="ui.header.translator_title">…</span>
    <span class="puce discret" id="puce-ia" hidden></span>
  </div>
  <a id="lien-github" class="lien-entete" href="#" target="_blank" rel="noopener" aria-disabled="true">GitHub</a>
  <select id="choix-langue" class="choix-langue" data-i18n-title="ui.header.language" data-i18n-aria-label="ui.header.language"></select>
  <button id="btn-theme" class="secondaire theme" type="button"></button>
  <button id="btn-reglages" class="secondaire" disabled data-i18n="ui.settings"></button>
  <span class="puce attention process" id="process" hidden></span>
</header>

<main inert aria-busy="true">
  <div id="chargement" class="bandeau" role="status"><span class="rond" aria-hidden="true"></span><span id="chargement-texte" data-i18n="ui.loading"></span></div>
  <div id="coupure" class="bandeau" hidden data-i18n="ui.service_down"></div>
  <div id="dernier-lot" class="bandeau" hidden>
    <strong id="dernier-lot-titre"></strong>
    <div class="aide" id="dernier-lot-detail"></div>
    <div class="actions">
      <button type="button" class="principal" id="btn-dernier-reprendre" data-i18n="ui.last_batch.resume"></button>
      <button type="button" class="secondaire" id="btn-dernier-regler" data-i18n="ui.last_batch.settings_first" data-i18n-title="ui.last_batch.settings_first_title"></button>
      <button type="button" class="secondaire" id="btn-dernier-ignorer" data-i18n="ui.last_batch.ignore" data-i18n-title="ui.last_batch.ignore_title"></button>
    </div>
  </div>
  <section class="carte" id="saisie">
    <form id="form-source">
      <label for="source" data-i18n="ui.source.label"></label>
      <div class="ligne">
        <input id="source" type="text" data-i18n-placeholder="ui.source.placeholder" autocomplete="off" spellcheck="false">
        <button type="submit" id="btn-go" class="principal" data-i18n="ui.source.start"></button>
      </div>
      <div id="apercu" class="apercu" hidden></div>
    </form>

    <div id="depot" class="depot">
      <div class="depot-actions">
        <strong data-i18n="ui.drop.title"></strong>
        <span class="aide" data-i18n="ui.drop.or"></span>
        <button type="button" id="btn-parcourir" class="secondaire" data-i18n="ui.browse"></button>
        <button type="button" id="btn-dossier-source" class="secondaire" data-i18n="ui.drop.folder"></button>
        <button type="button" id="btn-reprendre-lot" class="secondaire" data-i18n="ui.drop.resume_batch" data-i18n-title="ui.drop.resume_batch_title"></button>
      </div>
      <div class="aide" data-i18n="ui.drop.help"></div>
      <div id="depot-progression" class="progression" hidden><div class="barre"></div><span class="texte"></span></div>
    </div>

    <div id="dossier" class="sous-carte" hidden>
      <div class="entete">
        <h2 data-i18n="ui.folder.title"></h2>
        <button type="button" class="secondaire petit" id="btn-dossier-plier" data-i18n="ui.folder.expand_all"></button>
        <button type="button" class="secondaire petit" id="btn-dossier-tout" data-i18n="ui.check_all"></button>
        <button type="button" class="secondaire petit" id="btn-dossier-rien" data-i18n="ui.uncheck_all"></button>
        <button type="button" class="secondaire petit" id="btn-dossier-manquants" data-i18n="ui.folder.check_missing" data-i18n-title="ui.folder.check_missing_title"></button>
        <button type="button" class="fermer" id="btn-fermer-dossier" data-i18n-aria-label="ui.close">×</button>
    </div>
      <div class="aide" id="dossier-racine"></div>
      <div id="dossier-chargement" class="ligne" hidden>
        <div id="dossier-progression" class="progression"><div class="barre"></div><span class="texte"></span></div>
        <button type="button" class="secondaire petit" id="btn-dossier-annuler" data-i18n="ui.cancel"></button>
      </div>
      <div id="dossier-lot-existant" class="aide" hidden></div>
      <div class="cases" style="margin-top:10px">
        <label class="case"><span data-i18n="ui.folder.spoken_all"></span> <select id="dossier-langue-globale"></select></label>
        <button type="button" class="secondaire petit" id="btn-dossier-appliquer-langue" data-i18n="ui.folder.apply"></button>
        <span class="aide" data-i18n="ui.folder.apply_help"></span>
    </div>
      <div id="dossier-arbre" class="arbre"></div>
    </div>

    <div class="objectif">
      <span class="aide" data-i18n="ui.goal.title"></span>
      <div class="cases">
        <label class="case"><input type="radio" name="objectif" value="traduction" checked> <span data-i18n="ui.goal.subtitles"></span></label>
        <label class="case" id="zone-objectif-doublage"><input type="radio" name="objectif" value="assemblage" id="opt-objectif-doublage"> <span data-i18n="ui.goal.dubbing"></span></label>
      </div>
      <label class="case" id="zone-remplacer" hidden><input type="checkbox" id="opt-remplacer"> <span data-i18n="ui.goal.replace"></span></label>
      <div class="aide" id="note-objectif"></div>
    </div>
    <div class="options">
      <label><span data-i18n="ui.transcription"></span>
        <select id="opt-transcription"></select>
      </label>
      <label><span data-i18n="ui.translation"></span>
        <select id="opt-traducteur"></select>
      </label>
      <label><span data-i18n="ui.spoken_language"></span>
        <select id="opt-langue"></select>
      </label>
      <div class="large groupe">
        <span class="aide" data-i18n="ui.targets_help"></span>
        <div id="opt-langues" class="cases"></div>
      </div>
      <div class="large groupe">
        <span class="aide" data-i18n="ui.dest.title"></span>
        <div class="cases">
          <label class="case"><input type="checkbox" id="opt-dest-a-cote"> <span data-i18n="ui.dest.next_to"></span></label>
          <label class="case"><input type="checkbox" id="opt-dest-sortie"> <span data-i18n="ui.dest.output"></span></label>
          <span class="aide" id="sortie-rappel" data-i18n-title="ui.dest.reminder_title"></span>
        </div>
        <div class="ligne" id="zone-sortie" hidden>
          <input id="opt-sortie" type="text" spellcheck="false" data-i18n-placeholder="ui.output_folder">
          <button type="button" id="btn-dossier" class="secondaire" data-i18n="ui.browse"></button>
        </div>
      </div>
      <label class="case large"><input type="checkbox" id="opt-pause"> <span id="opt-pause-texte" data-i18n="ui.pause_option"></span></label>
      <label class="case large"><input type="checkbox" id="opt-refaire"> <span data-i18n="ui.redo_option"></span></label>
    </div>
    <div id="moteur-trad" class="moteur-inline" hidden></div>
    <div class="actions" id="dossier-actions" hidden>
      <label class="case" id="zone-relecture"><input type="checkbox" id="opt-relecture"> <span data-i18n="ui.review_option"></span></label>
      <button type="button" class="principal" id="btn-lancer-lot" data-i18n="ui.start_batch"></button>
      <span class="aide" id="dossier-resume"></span>
    </div>
    <datalist id="modeles-claude"><option value="claude-sonnet-5-5"><option value="claude-opus-5-5"><option value="claude-haiku-5-5"></datalist>
  </section>

  <section class="carte" id="lot" hidden>
    <div class="entete">
      <h2><span data-i18n="ui.batch.title"></span> <span class="aide" id="lot-racine"></span></h2>
      <span class="etat" id="lot-etat" role="status"></span>
      <button type="button" class="secondaire" id="btn-lot-suspendre" data-i18n="ui.batch.pause" data-i18n-title="ui.batch.pause_title"></button>
      <button type="button" class="secondaire" id="btn-lot-reprendre" data-i18n="ui.batch.resume"></button>
      <button type="button" class="secondaire" id="btn-lot-reessayer" data-i18n-title="ui.batch.retry_title" hidden></button>
      <button type="button" class="secondaire danger" id="btn-lot-annuler" data-i18n="ui.cancel"></button>
    </div>
    <p class="aide" id="lot-info-pause" hidden></p>
    <div class="progression" id="lot-progression"><div class="barre"></div><span class="texte"></span></div>
    <div id="lot-actives" class="lot-actives" hidden></div>
    <div class="lot-objectif" id="lot-zone-objectif" hidden>
      <label><span data-i18n="ui.batch.produces"></span> <select id="lot-objectif"><option value="traduction" data-i18n="ui.goal.subtitles"></option><option value="assemblage" data-i18n="ui.goal.dubbing"></option></select></label>
      <label class="case" id="lot-zone-remplacer" hidden><input type="checkbox" id="lot-remplacer"> <span data-i18n="ui.batch.replace"></span></label>
      <span class="aide" id="lot-note-objectif"></span>
    </div>
    <div class="aide" id="lot-fichier"></div>
    <div id="lot-suspendu" class="pause" hidden>
      <div><strong data-i18n="ui.batch.next_settings"></strong> <span class="aide" data-i18n="ui.batch.next_settings_help"></span></div>
      <div class="options">
        <label><span data-i18n="ui.transcription"></span> <select id="lot-susp-transcription"></select></label>
        <label><span data-i18n="ui.translator"></span> <select id="lot-susp-traducteur"></select></label>
        <div class="large groupe"><span class="aide" data-i18n="ui.target_languages"></span><div id="lot-susp-langues" class="cases"></div></div>
      </div>
    </div>
    <div id="lot-pause" class="pause" hidden>
      <div><strong data-i18n="ui.batch.all_transcribed"></strong> <span class="aide" id="lot-pause-resume"></span></div>
      <div class="actions" id="lot-a-verifier" hidden>
        <span id="lot-a-verifier-texte"></span>
        <button type="button" class="secondaire" id="btn-lot-verifier" data-i18n="ui.check_names"></button>
      </div>
      <div class="couts" id="lot-couts"></div>
      <div class="options">
        <label><span data-i18n="ui.translator"></span> <select id="lot-traducteur"></select></label>
        <label id="lot-zone-modele" hidden><span data-i18n="ui.model"></span> <select id="lot-modele"></select></label>
        <label id="lot-zone-effort" hidden><span data-i18n="ui.effort"></span> <select id="lot-effort"><option value="low">low</option><option value="medium">medium</option><option value="high">high</option></select></label>
        <div class="large aide" id="lot-note-effort" hidden data-i18n="ui.batch.effort_note"></div>
        <div class="large groupe"><span class="aide" data-i18n="ui.target_languages"></span><div id="lot-langues" class="cases"></div></div>
      </div>
      <div class="actions">
        <button type="button" class="principal" id="btn-lot-traduire" data-i18n="ui.batch.translate_all"></button>
        <button type="button" class="secondaire" id="btn-lot-sans-traduire" data-i18n="ui.finish_untranslated"></button>
        <span class="aide" id="lot-message"></span>
      </div>
    </div>
    <div id="validation" class="pause" hidden>
      <div><strong id="validation-titre"></strong> <span class="aide" data-i18n="ui.names.help"></span></div>
      <div class="actions">
        <button type="button" class="secondaire petit" id="btn-validation-tout" data-i18n="ui.check_all"></button>
        <button type="button" class="secondaire petit" id="btn-validation-rien" data-i18n="ui.uncheck_all"></button>
      </div>
      <div class="validation-liste">
        <table>
          <thead><tr><th></th><th data-i18n="ui.names.heard"></th><th data-i18n="ui.names.fix"></th><th data-i18n="ui.names.french"></th><th data-i18n="ui.names.why"></th></tr></thead>
          <tbody id="validation-lignes"></tbody>
        </table>
      </div>
      <div class="actions">
        <button type="button" class="principal" id="btn-validation-valider"></button>
        <button type="button" class="secondaire" id="btn-validation-fermer" data-i18n="ui.close"></button>
        <span class="aide" id="validation-message"></span>
      </div>
    </div>
    <ul id="lot-videos" class="historique"></ul>
  </section>

  <section class="carte" id="tache" hidden>
    <div class="entete">
      <h2 id="tache-titre" data-i18n="ui.task.title"></h2>
      <span class="etat" id="tache-etat" role="status"></span>
      <button id="btn-annuler" class="secondaire danger" data-i18n="ui.cancel"></button>
      <button type="button" id="btn-relancer" class="principal" data-i18n="ui.retry" data-i18n-title="ui.retry_title" hidden></button>
    </div>
    <ol class="etapes" id="etapes">
      <li data-etape="source" data-i18n="ui.step.source"></li>
      <li data-etape="transcription" data-i18n="ui.transcription"></li>
      <li data-etape="decoupe" data-i18n="ui.step.split"></li>
      <li data-etape="relecture" data-i18n="ui.step.review" hidden></li>
      <li data-etape="traduction" data-i18n="ui.translation"></li>
      <li data-etape="fin" data-i18n="ui.step.files"></li>
      <li data-etape="doublage" data-i18n="ui.step.dubbing" hidden></li>
      <li data-etape="assemblage" hidden>MKV</li>
    </ol>
    <div id="pause" class="pause" hidden>
      <div><strong id="pause-titre" data-i18n="ui.task.paused_title"></strong> <span class="aide" id="pause-resume"></span></div>
      <div class="couts" id="pause-couts"></div>
      <div class="options">
        <label><span data-i18n="ui.translator"></span> <select id="pause-traducteur"></select></label>
        <div class="large groupe"><span class="aide" data-i18n="ui.target_languages"></span><div id="pause-langues" class="cases"></div></div>
      </div>
      <div class="actions">
        <button type="button" class="principal" id="btn-traduire" data-i18n="ui.translate"></button>
        <button type="button" class="secondaire" id="btn-sans-traduire" data-i18n="ui.finish_untranslated" data-i18n-title="ui.task.finish_untranslated_title"></button>
        <span class="aide" id="pause-message"></span>
      </div>
    </div>
    <div id="resultat" class="resultat" hidden></div>
    <pre id="journal" class="journal"><span id="journal-texte"></span><span id="journal-minuteur" class="minuteur"></span></pre>
    <div class="actions-journal"><button type="button" id="btn-relancer-journal" class="secondaire petit" data-i18n="ui.retry" data-i18n-title="ui.retry_title" hidden></button></div>
  </section>

  <section class="carte" id="historique-carte">
    <div class="entete"><h2 data-i18n="ui.history.title"></h2><button type="button" class="secondaire petit" id="btn-historique" hidden></button></div>
    <ul id="historique" class="historique"></ul>
  </section>
</main>

<dialog id="dlg-reglages">
  <form method="dialog" id="form-reglages">
    <div class="entete"><h2 data-i18n="ui.settings"></h2><button type="button" class="fermer" id="btn-fermer-reglages" data-i18n-aria-label="ui.close">×</button></div>
    <p class="aide" data-i18n-html="ui.cfg.keys_help"></p>

    <h3 data-i18n="ui.cfg.general"></h3>
    <div class="grille">
      <label><span data-i18n="ui.output_folder"></span> <input type="text" id="cfg-sortie"></label>
      <label><span data-i18n="ui.cfg.default_language"></span> <input type="text" id="cfg-langue" data-i18n-placeholder="ui.cfg.default_language_placeholder"></label>
      <label><span data-i18n="ui.cfg.ytdlp"></span> <input type="text" id="cfg-youtube"></label>
      <label><span data-i18n="ui.cfg.chunk"></span> <input type="number" id="cfg-lot" min="1" max="100"></label>
      <label><span data-i18n="ui.cfg.idle"></span> <input type="number" id="cfg-inactivite" min="0" max="10080"></label>
    </div>

    <h3><span data-i18n="ui.cfg.servers"></span> <button type="button" class="secondaire petit" id="btn-ajout-transcription" data-i18n="ui.add"></button></h3>
    <div id="liste-transcriptions" class="moteurs-liste"></div>

    <h3><span data-i18n="ui.cfg.translators"></span> <button type="button" class="secondaire petit" id="btn-ajout-traducteur" data-i18n="ui.add"></button></h3>
    <div id="liste-traducteurs" class="moteurs-liste"></div>

    <h3><span data-i18n="ui.cfg.cleanup"></span> <span class="aide" data-i18n="ui.cfg.cleanup_help"></span></h3>
    <div class="cases">
      <label class="case"><input type="checkbox" id="cfg-net-audio"> <span data-i18n="ui.cfg.clean_audio"></span> <span class="aide" data-bilan="audio"></span></label>
      <label class="case"><input type="checkbox" id="cfg-net-sous-titres"> <span data-i18n="ui.cfg.clean_subtitles"></span> <span class="aide" data-bilan="sous_titres"></span></label>
      <label class="case"><input type="checkbox" id="cfg-net-transcription"> <span data-i18n="ui.cfg.clean_transcription"></span> <span class="aide" data-bilan="transcription"></span></label>
      <label class="case"><input type="checkbox" id="cfg-net-journaux"> <span data-i18n="ui.cfg.clean_logs"></span> <span class="aide" data-bilan="journaux"></span></label>
      <label class="case"><span data-i18n="ui.cfg.older_than"></span> <input type="number" id="cfg-net-age" min="0" max="8760" style="width:70px"> <span data-i18n="ui.cfg.older_than_help"></span></label>
    </div>
    <div class="actions">
      <button type="button" class="secondaire petit" id="btn-nettoyer" data-i18n="ui.cfg.clean_now"></button>
      <span class="aide" id="nettoyage-retour" data-i18n="ui.cfg.clean_now_help"></span>
    </div>

    <h3 data-i18n="ui.cfg.layout"></h3>
    <div class="grille">
      <label><span data-i18n="ui.cfg.cpl"></span> <input type="number" id="cfg-cpl" min="20" max="80"></label>
      <label><span data-i18n="ui.cfg.lines"></span> <input type="number" id="cfg-lignes" min="1" max="3"></label>
      <label><span data-i18n="ui.cfg.max_duration"></span> <input type="number" id="cfg-dmax" step="0.5" min="2" max="12"></label>
      <label><span data-i18n="ui.cfg.min_duration"></span> <input type="number" id="cfg-dmin" step="0.1" min="0.3" max="3"></label>
      <label><span data-i18n="ui.cfg.gap"></span> <input type="number" id="cfg-pause" step="0.1" min="0.2" max="3"></label>
      <label><span data-i18n="ui.cfg.cps"></span> <input type="number" id="cfg-cps" min="8" max="30"></label>
    </div>

    <div class="pied">
      <span id="reglages-message" class="aide"></span>
      <button type="button" class="secondaire" id="btn-annuler-reglages" data-i18n="ui.cancel"></button>
      <button type="button" class="principal" id="btn-enregistrer-reglages" data-i18n="ui.save"></button>
    </div>
  </form>
</dialog>

<template id="tpl-transcription">
  <div class="moteur">
    <div class="grille">
      <label>Id <input type="text" data-champ="id"></label>
      <label><span data-i18n="ui.eng.name"></span> <input type="text" data-champ="nom"></label>
      <label>URL <input type="text" data-champ="url" data-i18n-placeholder="ui.eng.url_placeholder"></label>
      <label><span data-i18n="ui.eng.key"></span> <input type="text" data-champ="cle" data-i18n-placeholder="ui.eng.key_placeholder"></label>
      <label><span data-i18n="ui.eng.speed"></span> <input type="text" data-champ="vitesse" data-i18n-placeholder="ui.eng.speed_placeholder"></label>
      <label class="large"><span data-i18n="ui.eng.command"></span> <input type="text" data-champ="commande"></label>
      <label><span data-i18n="ui.eng.command_folder"></span> <input type="text" data-champ="dossier"></label>
    </div>
    <div class="actions">
      <label class="case"><input type="radio" name="transcription-active" data-champ="actif"> <span data-i18n="ui.eng.active"></span></label>
      <button type="button" class="secondaire petit" data-action="tester" data-i18n="ui.eng.test"></button>
      <button type="button" class="secondaire petit danger" data-action="supprimer" data-i18n="ui.eng.delete"></button>
      <span class="aide" data-role="retour"></span>
    </div>
  </div>
</template>

<template id="tpl-traducteur">
  <div class="moteur">
    <div class="grille">
      <label>Id <input type="text" data-champ="id"></label>
      <label><span data-i18n="ui.eng.name"></span> <input type="text" data-champ="nom"></label>
      <label><span data-i18n="ui.eng.type"></span>
        <select data-champ="type">
          <option value="openai" data-i18n="ui.eng.type_openai"></option>
          <option value="claude" data-i18n="ui.eng.type_claude"></option>
          <option value="aucun" data-i18n="ui.eng.type_none"></option>
        </select>
      </label>
      <label><span data-i18n="ui.model"></span> <input type="text" data-champ="modele"></label>
      <label><span data-i18n="ui.eng.effort_claude"></span>
        <select data-champ="effort"><option value="" data-i18n="ui.effort_default"></option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option></select>
      </label>
      <label><span data-i18n="ui.eng.url_openai"></span> <input type="text" data-champ="url" placeholder="http://127.0.0.1:8080"></label>
      <label><span data-i18n="ui.eng.key"></span> <input type="text" data-champ="cle" data-i18n-placeholder="ui.eng.key_placeholder"></label>
      <label><span data-i18n="ui.supervision"></span> <input type="text" data-champ="supervision" data-i18n-placeholder="ui.eng.supervision_placeholder"></label>
      <label class="case"><input type="checkbox" data-champ="arreter_apres"> <span data-i18n="ui.stop_after"></span></label>
    </div>
    <div class="actions">
