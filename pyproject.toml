[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-generate-subtitles"
description = "Subtitles for a YouTube video or a local file: self-hosted transcription, translation by a local or remote LLM, timed .srt and .vtt files."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
claude = ["anthropic"]
dev = ["pytest", "ruff"]

[project.scripts]
subtitles = "subtitles.__main__:main"
subtitles-web = "subtitles.web.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "subtitles.__version__" }

[tool.setuptools.packages.find]
include = ["subtitles*"]

[tool.setuptools.package-data]
subtitles = ["config.toml", "locales/*.json"]
"subtitles.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E741", "B905"]  # long lines and short names: project style; zip: lengths already guaranteed
